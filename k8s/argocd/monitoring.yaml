apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.1.1          # version figée : on met à jour volontairement, jamais en "latest"
    helm:
      releaseName: kube-prometheus-stack
      valuesObject:
        # ── Allègement pour une VM de 4 Go ──────────────────────────
        alertmanager:
          enabled: false            # à réactiver plus tard pour les notifications

        # ── k3s embarque ces composants dans son binaire : rien à scraper ──
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: false

        prometheusOperator:
          admissionWebhooks:
            enabled: false          # simplification pour un lab (évite les jobs/hooks de certificats)
          tls:
            enabled: false
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 160Mi }

        prometheus:
          service:
            type: NodePort
            nodePort: 30090
          prometheusSpec:
            retention: 3d
            retentionSize: 4GB
            scrapeInterval: 30s
            # Prendre en compte tous les ServiceMonitor/PodMonitor du cluster
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            resources:
              requests: { cpu: 100m, memory: 400Mi }
              limits: { memory: 900Mi }
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 5Gi

        grafana:
          admin:
            existingSecret: grafana-admin     # créé à la main : un mot de passe ne va jamais dans Git
            userKey: admin-user
            passwordKey: admin-password
          service:
            type: NodePort
            nodePort: 30300
          persistence:
            enabled: true
            storageClassName: local-path
            size: 1Gi
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }

        kube-state-metrics:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 96Mi }

        prometheus-node-exporter:
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true        # indispensable : les CRD du chart sont trop volumineuses sinon