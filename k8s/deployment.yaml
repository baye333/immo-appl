apiVersion: apps/v1
kind: Deployment
metadata:
  name: immo-app
  namespace: immo-app
  labels:
    app: immo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: immo-app
  template:
    metadata:
      labels:
        app: immo-app
    spec:
      containers:
        - name: immo-app
          image: bayelahad/immo-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"